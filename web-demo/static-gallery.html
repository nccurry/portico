<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Portico demo gallery</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <style>
      body {
        background: #0e1117;
        color: #f0f4f8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        margin: 0 auto;
        max-width: 1120px;
        padding: 3rem 1.25rem;
      }

      a {
        color: #7cb7ff;
      }

      header {
        text-align: center;
      }

      header img {
        height: 112px;
        width: 112px;
      }

      .notice {
        background: #171c26;
        border: 1px solid #2a3441;
        border-radius: 10px;
        margin: 2rem 0;
        padding: 1rem;
      }

      figure {
        margin: 2.5rem 0;
      }

      figure img {
        border: 1px solid #2a3441;
        border-radius: 10px;
        display: block;
        height: auto;
        width: 100%;
      }

      figcaption {
        color: #94a3b8;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="./logo.svg" alt="Portico logo" />
      <h1>Portico demo gallery</h1>
      <p>A private, self-hosted dashboard for Tiller-powered finances.</p>
    </header>
    <div class="notice">
      The interactive browser demo is not available for this build. These images use synthetic data.
      <a href="https://github.com/nccurry/portico#try-the-demo">Run the container demo locally.</a>
      Source:
      <a href="https://github.com/nccurry/portico/tree/__REVISION__"><code>__REVISION__</code></a>.
    </div>
    <main>
      <figure>
        <img src="./images/demo-overview.png" alt="Portico home dashboard" />
        <figcaption>Accounts and net worth</figcaption>
      </figure>
      <figure>
        <img src="./images/demo-spending.png" alt="Portico spending dashboard" />
        <figcaption>Spending by category</figcaption>
      </figure>
      <figure>
        <img src="./images/demo-budget.png" alt="Portico budget dashboard" />
        <figcaption>Budget tracking</figcaption>
      </figure>
      <figure>
        <img
          src="./images/demo-financial-independence.png"
          alt="Portico financial independence dashboard"
        />
        <figcaption>Financial independence</figcaption>
      </figure>
      <figure>
        <img src="./images/demo-data-health.png" alt="Portico data health dashboard" />
        <figcaption>Data health</figcaption>
      </figure>
    </main>
  </body>
</html>
