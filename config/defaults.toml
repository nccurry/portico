[data]
mode = "google_sheets"
demo_directory = "demo/data"
demo_reference_date = "1995-04-20T00:00:00+00:00"

[reporting]
lookback_months = [3, 6, 12, 24]
default_lookback_months = 12

[thresholds]
expense = 3000
income = 20000
duplicate_minimum = 10.0
duplicate_days = 1

[income_savings]
default_view = "regular"
target_rate = 20
exclude_categories = [
    "Tax Return Refund",
    "Investment",
    "Credit Card Rewards",
    "RSU",
    "ESPP",
    "Bonus",
    "Received Gift",
    "Tax Return Payment",
    "Christmas",
    "Home Repairs",
    "Automobile Repairs",
    "Home Improvements",
    "Misc Maintainence",
]
exclude_groups = ["Travel", "Donations"]

[spending]
default_view = "discretionary"
exclude_categories = ["Automobile Fuel", "Given Gift", "Groceries", "Tax Return Payment"]
exclude_groups = ["Bills", "Donations", "Health", "Housing", "Income", "Insurance", "Maintenance", "Travel"]

[subscriptions]
known_category_terms = ["subscription"]
minimum_confidence = 80
stale_after_days = 45
default_exclude_categories = ["Automobile Fuel", "Fee", "Medical Bill", "Video Games"]
detection_excluded_categories = [
    "Mortgage Payment",
    "Auto Loan Payment",
    "Student Loan Payment",
    "Personal Loan Payment",
    "Car Payment",
    "Rent",
    "Investment",
    "Stock Purchase",
    "401k",
    "HSA",
    "RSU",
    "ESPP",
]
detection_excluded_pattern = "Mortgage|Loan|Investment|401k|HSA|RSU|ESPP"

[year_over_year]
utility_group_terms = ["bill", "housing"]
utility_category_terms = [
    "electric",
    "gas",
    "rent",
    "water",
    "sewer",
    "internet",
    "phone",
    "mobile",
    "cable",
    "trash",
    "garbage",
    "utility",
]

[budget]
history_months = 12

[data_health]
stale_account_days = 7
duplicate_require_same_account = true
duplicate_require_same_category = false
duplicate_require_same_description = true

[financial_independence]
expected_return_rate = 7.0
withdrawal_rate = 4.0
# Fixed funding goal shown on the Home-page financial-safety card.
target_amount = 5_000_000
spending_lookback_months = 12
projection_years = 50
included_account_patterns = []
included_groups = ["Savings", "Investments", "Retirement"]

[financial_safety]
# Count liquid balances from these groups toward the emergency fund.
emergency_fund_target_months = 6
emergency_fund_included_groups = ["Savings"]
emergency_fund_included_account_patterns = []
emergency_fund_spending_lookback_months = 6
# Exclude irregular categories or groups that you would not fund in an emergency.
emergency_fund_exclude_categories = []
emergency_fund_exclude_groups = ["Travel", "Donations"]
# Debt progress uses the first recorded balance unless you set an ISO date here.
debt_included_groups = ["Credit Cards", "Home Loan", "Auto Loan"]
debt_included_account_patterns = []
debt_baseline_date = ""

[weekly_summary]
average_weeks = 8
rolling_weeks = 4
top_merchant_count = 3

[merchants.aliases]
