---
version: '3'

vars:
  VENV: .venv
  PYTHON: '{{.VENV}}/Scripts/python'
  UV: uv

tasks:
  # ========================================
  # Setup
  # ========================================

  setup:
    desc: "Setup development environment (auto-detects platform)"
    cmds:
      - task: setup:{{OS}}

  setup:windows:
    desc: "Complete Windows development environment setup"
    platforms: [windows]
    cmds:
      - task: setup:check
      - echo "[SETUP] Starting Windows development environment setup..."
      - task: setup:venv
      - task: setup:deps
      - task: setup:verify
      - echo "[OK] Setup complete! Run 'task test' to run tests."

  setup:linux:
    desc: "Complete Linux development environment setup"
    platforms: [linux, darwin]
    cmds:
      - task: setup:check
      - echo "[SETUP] Starting Linux development environment setup..."
      - task: setup:venv
      - task: setup:deps
      - task: setup:verify
      - echo "[OK] Setup complete! Run 'task test' to run tests."

  setup:check:
    desc: "Check development environment status"
    cmds:
      - echo "=== Development Environment Check ==="
      - task: setup:check:python
      - task: setup:check:uv
      - echo "=== Check complete ==="

  setup:check:python:
    desc: "Check if Python is available in venv"
    cmds:
      - cmd: '{{.PYTHON}} --version'
        ignore_error: true

  setup:check:uv:
    desc: "Check if uv is installed"
    cmds:
      - cmd: '{{.UV}} --version'
        ignore_error: true

  setup:venv:
    desc: "Create virtual environment with uv"
    cmds:
      - echo "[SETUP] Creating virtual environment..."
      - '{{.UV}} venv {{.VENV}} --python 3.14'
      - echo "[OK] Virtual environment created"
    status:
      - test -d {{.VENV}}

  setup:deps:
    desc: "Install all dependencies (app + dev)"
    cmds:
      - echo "[SETUP] Installing dependencies..."
      - '{{.UV}} pip install -r requirements.txt --python {{.PYTHON}}'
      - '{{.UV}} pip install -r requirements-dev.txt --python {{.PYTHON}}'
      - echo "[OK] Dependencies installed"

  setup:verify:
    desc: "Verify setup is working"
    cmds:
      - echo "=== Verifying setup ==="
      - task: setup:check
      - '{{.PYTHON}} -c "import streamlit; import pandas; import altair; print(\"[OK] All imports successful\")"'
      - '{{.PYTHON}} -m pytest --version'
      - echo "[OK] All verification checks passed!"

  # ========================================
  # Package Management
  # ========================================

  pkg:check:
    desc: "Check for outdated Python packages"
    cmds:
      - '{{.UV}} pip list --outdated --python {{.PYTHON}}'

  pkg:update:
    desc: "Update all packages to latest versions"
    cmds:
      - '{{.UV}} pip install --upgrade -r requirements.txt --python {{.PYTHON}}'
      - '{{.UV}} pip install --upgrade -r requirements-dev.txt --python {{.PYTHON}}'
      - echo "Packages updated. Run 'task test' to verify nothing broke."

  # ========================================
  # Testing
  # ========================================

  test:
    desc: "Run all tests"
    cmds:
      - '{{.PYTHON}} -m pytest'

  test:verbose:
    desc: "Run all tests with verbose output"
    cmds:
      - '{{.PYTHON}} -m pytest -v'

  test:file:
    desc: "Run tests for a specific file (usage: task test:file -- test_spreadsheet.py)"
    cmds:
      - '{{.PYTHON}} -m pytest tests/{{.CLI_ARGS}} -v'

  test:match:
    desc: "Run tests matching a pattern (usage: task test:match -- test_filter)"
    cmds:
      - '{{.PYTHON}} -m pytest -k "{{.CLI_ARGS}}" -v'

  test:coverage:
    desc: "Run tests with coverage report"
    cmds:
      - '{{.PYTHON}} -m pytest --cov=src --cov=Pages --cov-report=term-missing'

  # ========================================
  # Linting
  # ========================================

  lint:
    desc: "Check code formatting with ruff"
    cmds:
      - '{{.PYTHON}} -m ruff check src/ Pages/ tests/ Home.py'

  lint:fix:
    desc: "Auto-fix formatting issues with ruff"
    cmds:
      - '{{.PYTHON}} -m ruff check --fix src/ Pages/ tests/ Home.py'

  # ========================================
  # Run
  # ========================================

  run:
    desc: "Run the Streamlit app"
    cmds:
      - '{{.PYTHON}} -m streamlit run Home.py'
