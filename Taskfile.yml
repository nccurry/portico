---
version: '3'

vars:
  CONFIGURATION: '{{default "Debug" .CONFIGURATION}}'
  SOLUTION: Portico.Roci.slnx

tasks:
  default:
    desc: "Restore, lint, build, and test the active .NET solution"
    cmds:
      - task: check

  check:
    desc: "Run the normal non-visual .NET validation path"
    cmds:
      - task: restore
      - task: lint
      - task: build:strict
      - task: dotnet:test
      - task: dotnet:coverage
      - task: test:roci-source

  roci:source:check:
    internal: true
    cmds:
      - dotnet msbuild src/Portico.App/Portico.App.csproj -target:ValidateLocalRociSource -nologo

  restore:
    aliases: [roci:restore]
    desc: "Restore the active .NET solution"
    deps: [roci:source:check]
    cmds:
      - dotnet restore {{.SOLUTION}} -p:Configuration={{.CONFIGURATION}} -p:ShouldUnsetParentConfigurationAndPlatform=false

  format:
    aliases: [roci:format]
    desc: "Format the active .NET solution"
    deps: [roci:source:check]
    cmds:
      - dotnet format {{.SOLUTION}} --no-restore

  lint:
    aliases: [roci:lint]
    desc: "Check .NET formatting and analyzers"
    deps: [roci:source:check]
    cmds:
      - dotnet format {{.SOLUTION}} --verify-no-changes --no-restore --verbosity minimal

  build:
    aliases: [roci:build]
    desc: "Build the active .NET solution"
    deps: [roci:source:check]
    cmds:
      - dotnet build {{.SOLUTION}} --no-restore -p:Configuration={{.CONFIGURATION}} -p:ShouldUnsetParentConfigurationAndPlatform=false

  build:strict:
    aliases: [roci:build:strict]
    desc: "Build the active .NET solution with warnings as errors"
    deps: [roci:source:check]
    cmds:
      - dotnet build {{.SOLUTION}} --no-restore --no-incremental -p:Configuration={{.CONFIGURATION}} -p:ShouldUnsetParentConfigurationAndPlatform=false -p:TreatWarningsAsErrors=true

  test:
    aliases: [roci:test]
    desc: "Run non-visual .NET tests"
    cmds:
      - task: dotnet:test

  dotnet:test:
    desc: "Run every non-visual .NET test lane, including the published-process check"
    cmds:
      - task: dotnet:test:architecture
      - task: dotnet:test:finance
      - task: dotnet:test:application
      - task: dotnet:test:configuration
      - task: dotnet:test:data
      - task: dotnet:test:cli
      - task: dotnet:test:app
      - task: dotnet:test:desktop
      - task: dotnet:test:e2e

  dotnet:test:architecture:
    desc: "Test project boundaries after restore and build"
    cmds:
      - dotnet test tests/Portico.Architecture.Tests/Portico.Architecture.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:finance:
    desc: "Test financial rules after restore and build"
    cmds:
      - dotnet test tests/Portico.Finance.Tests/Portico.Finance.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:application:
    desc: "Test application use cases after restore and build"
    cmds:
      - dotnet test tests/Portico.Application.Tests/Portico.Application.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:configuration:
    desc: "Test TOML configuration after restore and build"
    cmds:
      - dotnet test tests/Portico.Configuration.Tests/Portico.Configuration.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:data:
    desc: "Test CSV and Google source readers after restore and build"
    cmds:
      - dotnet test tests/Portico.Data.Tests/Portico.Data.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:cli:
    desc: "Test command parsing and output after restore and build"
    cmds:
      - dotnet test tests/Portico.Cli.Tests/Portico.Cli.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:app:
    desc: "Test executable composition after restore and build"
    deps: [roci:source:check]
    cmds:
      - dotnet test tests/Portico.App.Tests/Portico.App.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}}

  dotnet:test:desktop:
    desc: "Test desktop behavior without visual capture after restore and build"
    deps: [roci:source:check]
    cmds:
      - dotnet test tests/Portico.Desktop.Tests/Portico.Desktop.Tests.csproj --no-build --no-restore -p:Configuration={{.CONFIGURATION}} --filter "Category!=VisualCapture"

  dotnet:test:e2e:
    desc: "Test the published executable with synthetic files"
    cmds:
      - task: test:published

  dotnet:test:visual:
    desc: "Capture the Roci desktop pages"
    cmds:
      - task: visual

  dotnet:coverage:
    desc: "Require 95% line and 90% branch coverage in Finance and Application"
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tests/Portico.BuildContract/Measure-Coverage.ps1 -Configuration {{.CONFIGURATION}}

  test:published:
    desc: "Publish Portico and exercise its headless commands as a process"
    deps: [restore]
    cmds:
      - dotnet build tests/Portico.EndToEnd.Tests/Portico.EndToEnd.Tests.csproj --no-restore -p:Configuration={{.CONFIGURATION}} -p:ShouldUnsetParentConfigurationAndPlatform=false
      - dotnet exec tests/Portico.EndToEnd.Tests/bin/{{.CONFIGURATION}}/net11.0/Portico.EndToEnd.Tests.dll -trait Category=PublishedProcess

  test:roci-source:
    desc: "Verify the local Roci source contract"
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tests/Portico.BuildContract/Verify-RociSource.ps1

  visual:
    aliases: [roci:visual]
    desc: "Capture the current Roci dashboard pages"
    env:
      PORTICO_CAPTURE_OUTPUT_DIR: artifacts/visual/portico-current
      PORTICO_CAPTURE_RETAIN_OUTPUT: "true"
    cmds:
      - task: restore
      - task: build
      - dotnet test tests/Portico.Desktop.Tests/Portico.Desktop.Tests.csproj --no-restore -p:Configuration={{.CONFIGURATION}} -p:ShouldUnsetParentConfigurationAndPlatform=false --filter "Category=VisualCapture" -m:1 -- xUnit.ParallelizeTestCollections=false

  doctor:
    aliases: [roci:doctor]
    desc: "Run the active .NET dashboard setup check"
    deps: [roci:source:check]
    cmds:
      - dotnet run --project src/Portico.App/Portico.App.csproj -p:Configuration={{.CONFIGURATION}} -- doctor {{.CLI_ARGS}}

  run:
    aliases: [roci:run]
    desc: "Run the active .NET desktop dashboard"
    deps: [roci:source:check]
    cmds:
      - dotnet run --project src/Portico.App/Portico.App.csproj -p:Configuration={{.CONFIGURATION}} -- run {{.CLI_ARGS}}

  publish:win-x64:
    aliases: [roci:publish:win-x64]
    desc: "Publish the dashboard for Windows x64"
    deps: [roci:source:check]
    cmds:
      - dotnet publish src/Portico.App/Portico.App.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishSingleFile=true --property:IncludeNativeLibrariesForSelfExtract=true --property:DebugType=None --property:DebugSymbols=false --property:GenerateDocumentationFile=false --output artifacts/publish/win-x64

  publish:linux-x64:
    aliases: [roci:publish:linux-x64]
    desc: "Publish the dashboard for Linux x64"
    deps: [roci:source:check]
    cmds:
      - dotnet publish src/Portico.App/Portico.App.csproj --configuration Release --runtime linux-x64 --self-contained true --property:PublishSingleFile=true --property:IncludeNativeLibrariesForSelfExtract=true --property:DebugType=None --property:DebugSymbols=false --property:GenerateDocumentationFile=false --output artifacts/publish/linux-x64
