---
version: '3'

vars:
  VENV: '{{default ".venv" .PORTICO_VENV}}'
  PYTHON: '{{if eq OS "windows"}}{{.VENV}}/Scripts/python.exe{{else}}{{.VENV}}/bin/python{{end}}'
  LOCAL_UV: '{{if eq OS "windows"}}.tools/bin/uv.exe{{else}}.tools/bin/uv{{end}}'
  LOCAL_TASK: '{{if eq OS "windows"}}.tools/bin/task.exe{{else}}.tools/bin/task{{end}}'
  UV: '{{default .LOCAL_UV .PORTICO_UV}}'
  TASK: '{{default .LOCAL_TASK .PORTICO_TASK}}'
  UV_PYTHON_DIR: '{{default ".tools/python" .UV_PYTHON_INSTALL_DIR}}'
  UV_CACHE: '{{default ".local/uv-cache" .UV_CACHE_DIR}}'
  PYTEST_TEMP: '{{default ".local/pytest-tmp" .PYTEST_TEMP}}'
  COVERAGE_INPUTS: '{{default "." .COVERAGE_INPUTS}}'
  LINT_PATHS: src/ pages/ tests/ scripts/ Home.py
  ADDRESS: '{{default "127.0.0.1" .ADDRESS}}'
  PORT: '{{default "8501" .PORT}}'
  TIMEZONE: '{{default "Etc/UTC" .TZ}}'
  DISCORD_ENABLED: '{{default "false" .PORTICO_DISCORD_ENABLED}}'
  DISCORD_CRON: '{{default "0 9 * * 0" .PORTICO_DISCORD_CRON}}'
  PERIOD_END: '{{default "" .PERIOD_END}}'
  FORCE: '{{default "false" .FORCE}}'
  OUTPUT: '{{default "text" .OUTPUT}}'

env:
  UV_PROJECT_ENVIRONMENT: '{{.VENV}}'
  UV_PYTHON_INSTALL_DIR: '{{.UV_PYTHON_DIR}}'
  UV_CACHE_DIR: '{{.UV_CACHE}}'

tasks:
  # ========================================
  # Setup
  # ========================================

  setup:
    desc: "Set up the development environment"
    cmds:
      - task: deps:python:install
      - task: deps:sync
      - task: setup:verify
      - echo "[OK] Setup complete. Run 'task test' to run tests."

  dev:sync:
    desc: "Synchronize the locked development environment"
    cmds:
      - task: deps:sync

  dev:verify:
    desc: "Verify the development toolchain and imports"
    cmds:
      - task: setup:verify

  deps:
    desc: "Report project dependency status"
    cmds:
      - task: deps:check

  deps:install:runtime:
    desc: "Install pinned Python and runtime dependencies"
    cmds:
      - task: deps:python:install
      - task: deps:sync:runtime
      - task: setup:verify:runtime

  deps:python:install:
    desc: "Install pinned uv and Python locally"
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-python-toolchain.ps1
        platforms: [windows]
      - cmd: sh scripts/install-python-toolchain.sh
        platforms: [linux, darwin]

  deps:sync:
    desc: "Install locked development dependencies"
    cmds:
      - echo "[SETUP] Installing dependencies..."
      - '{{.UV}} sync --locked --dev'

  deps:sync:runtime:
    desc: "Install locked runtime dependencies"
    cmds:
      - echo "[SETUP] Installing runtime dependencies..."
      - '{{.UV}} sync --locked --no-dev'

  setup:check:
    desc: "Check development environment status"
    cmds:
      - echo "=== Development Environment Check ==="
      - '{{.TASK}} --version'
      - '{{.UV}} --version'
      - '{{.UV}} run --locked --dev python --version'
      - echo "=== Check complete ==="

  setup:verify:
    desc: "Verify setup is working"
    cmds:
      - echo "=== Verifying setup ==="
      - task: setup:check
      - '{{.UV}} run --locked --dev python -c "import streamlit; import pandas; import altair; print(\"[OK] All imports successful\")"'
      - '{{.UV}} run --locked --dev pytest --version'
      - echo "[OK] All verification checks passed."

  setup:verify:runtime:
    desc: "Verify runtime dependencies"
    cmds:
      - '{{.PYTHON}} -c "import streamlit; import pandas; import altair; import streamlit_gsheets; print(\"[OK] Runtime imports successful\")"'

  # ========================================
  # Package Management
  # ========================================

  deps:check:
    desc: "Check dependency metadata and package updates"
    aliases: [pkg:check]
    cmds:
      - task: deps:check-lock
      - task: deps:outdated

  deps:check-lock:
    desc: "Check that uv.lock matches pyproject.toml"
    cmds:
      - '{{.UV}} lock --check'

  deps:outdated:
    desc: "List outdated project dependencies"
    cmds:
      - '{{.UV}} pip list --outdated --python {{.PYTHON}}'

  deps:update:
    desc: "Update direct dependencies to latest exact pins"
    aliases: [pkg:update]
    cmds:
      - '{{.UV}} remove --no-sync altair pandas st-gsheets-connection streamlit'
      - '{{.UV}} add --no-sync --bounds exact altair pandas st-gsheets-connection streamlit'
      - '{{.UV}} remove --dev --no-sync freezegun mypy pandas-stubs pytest pytest-cov ruff'
      - '{{.UV}} add --dev --no-sync --bounds exact freezegun mypy pandas-stubs pytest pytest-cov ruff'
      - '{{.UV}} lock --upgrade'
      - '{{.UV}} sync --dev'
      - echo "Packages updated. Run 'task check' to verify nothing broke."

  # ========================================
  # Testing
  # ========================================

  test:
    desc: "Run all tests"
    cmds:
      - task: test:unit
      - task: test:integration

  test:unit:
    desc: "Run unit tests"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} tests/unit'

  test:integration:
    desc: "Run integration tests"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} tests/integration'

  test:verbose:
    desc: "Run all tests with verbose output"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} -v'

  test:file:
    desc: "Run tests for a specific file (usage: task test:file -- test_spreadsheet.py)"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} tests/{{.CLI_ARGS}} -v'

  test:match:
    desc: "Run tests matching a pattern (usage: task test:match -- test_filter)"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} -k "{{.CLI_ARGS}}" -v'

  test:coverage:
    desc: "Run all tests and record coverage"
    cmds:
      - '{{.UV}} run --locked --dev pytest --basetemp={{.PYTEST_TEMP | quote}} --cov=src --cov=pages --cov-branch --cov-report='

  test:unit:coverage:
    desc: "Run unit tests and write parallel coverage data"
    cmds:
      - '{{.UV}} run --locked --dev coverage run --branch --parallel-mode --source=src,pages -m pytest --basetemp={{.PYTEST_TEMP | quote}} tests/unit'

  test:integration:coverage:
    desc: "Run integration tests and write parallel coverage data"
    cmds:
      - '{{.UV}} run --locked --dev coverage run --branch --parallel-mode --source=src,pages -m pytest --basetemp={{.PYTEST_TEMP | quote}} tests/integration'

  coverage:combine:
    desc: "Combine unit and integration coverage data"
    cmds:
      - '{{.UV}} run --locked --dev coverage combine {{.COVERAGE_INPUTS}}'

  coverage:check-src:
    desc: "Enforce at least 90% src coverage"
    cmds:
      - '{{.UV}} run --locked --dev coverage report --include="src/*" --show-missing --fail-under=90'

  coverage:check-total:
    desc: "Enforce at least 80% combined src and pages coverage"
    cmds:
      - '{{.UV}} run --locked --dev coverage report --show-missing --fail-under=80'

  coverage:summary:
    desc: "Print the combined coverage summary"
    cmds:
      - '{{.UV}} run --locked --dev coverage report --show-missing'

  coverage:html:
    desc: "Build the HTML coverage report"
    cmds:
      - '{{.UV}} run --locked --dev coverage html --directory build/coverage'

  coverage:xml:
    desc: "Build the XML coverage report"
    cmds:
      - '{{.UV}} run --locked --dev coverage xml -o build/coverage.xml'

  # ========================================
  # Linting
  # ========================================

  lint:
    desc: "Run all static checks"
    cmds:
      - task: lint:shell
      - task: lint:python
      - task: lint:format
      - task: lint:types

  lint:shell:
    desc: "Check shell script syntax"
    platforms: [linux, darwin]
    cmds:
      - sh -n .devcontainer/install-tools.sh scripts/bootstrap.sh scripts/install-python-toolchain.sh

  lint:python:
    desc: "Run Ruff lint checks"
    cmds:
      - '{{.UV}} run --locked --dev ruff check {{.LINT_PATHS}}'

  lint:format:
    desc: "Check Python formatting"
    cmds:
      - '{{.UV}} run --locked --dev ruff format --check {{.LINT_PATHS}}'

  lint:types:
    desc: "Run mypy"
    cmds:
      - '{{.UV}} run --locked --dev mypy'

  format:
    desc: "Apply safe Python lint and formatting fixes"
    aliases: [lint:fix]
    cmds:
      - '{{.UV}} run --locked --dev ruff check --fix {{.LINT_PATHS}}'
      - '{{.UV}} run --locked --dev ruff format {{.LINT_PATHS}}'

  # ========================================
  # All Checks
  # ========================================

  check:
    desc: "Run lint and tests"
    cmds:
      - task: lint
      - task: test

  docs:check:
    desc: "Validate documentation, assets, and standalone uv scripts"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.check_docs'

  config:init:
    desc: "Create an ignored local configuration file"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.init_config'

  # ========================================
  # Run
  # ========================================

  run:
    desc: "Run the Streamlit app on a validated address (localhost by default)"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address={{.ADDRESS | quote}} --port={{.PORT | quote}}'

  demo:
    desc: "Run the app with synthetic demo data on localhost"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address=127.0.0.1 --port={{.PORT | quote}} --data-source=demo'

  run:lan:
    desc: "Run the app on all interfaces for a trusted network"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address=0.0.0.0 --port={{.PORT | quote}}'

  doctor:
    desc: "Validate the configured data source"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.doctor {{.CLI_ARGS}}'

  pages:build:
    desc: "Build the GitHub Pages demo artifact"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.build_pages_demo'

  container:build:
    desc: "Build the local Linux container image"
    cmds:
      - docker build --tag portico:local .

  container:smoke:
    desc: "Build and health-test the demo container"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.smoke_container {{.CLI_ARGS}}'

  container:demo:
    desc: "Build and run the demo container on localhost"
    cmds:
      - task: container:build
      - >-
        docker run --rm --init --name portico
        --read-only --tmpfs /tmp:size=64m,mode=1777
        --cap-drop ALL --security-opt no-new-privileges:true
        --env PORTICO_DATA_SOURCE=demo
        --publish {{.ADDRESS}}:{{.PORT}}:8501
        portico:local

  container:live:
    desc: "Build and run the live container on localhost"
    cmds:
      - task: container:build
      - >-
        docker run --rm --init --name portico
        --read-only --tmpfs /tmp:size=64m,mode=1777
        --cap-drop ALL --security-opt no-new-privileges:true
        --env PORTICO_DATA_SOURCE=google_sheets
        --env TZ={{.TIMEZONE | quote}}
        --env PORTICO_DISCORD_ENABLED={{.DISCORD_ENABLED | quote}}
        --env PORTICO_DISCORD_CRON={{.DISCORD_CRON | quote}}
        --mount "type=bind,source={{.ROOT_DIR}}/config,target=/app/config,readonly"
        --mount "type=bind,source={{.ROOT_DIR}}/.streamlit/secrets.toml,target=/app/.streamlit/secrets.toml,readonly"
        --mount "type=volume,source=portico-state,target=/app/.local"
        --publish {{.ADDRESS}}:{{.PORT}}:8501
        portico:local

  container:down:
    desc: "Stop the Portico container"
    cmds:
      - docker stop portico

  container:notifier:
    desc: "Run one notifier command in the Portico container"
    cmds:
      - docker exec portico python -m scripts.weekly_discord_summary {{.CLI_ARGS}}

  # ========================================
  # Weekly Discord Summary
  # ========================================

  discord:check:
    desc: "Install runtime dependencies and check Discord summary configuration"
    cmds:
      - task: deps:install:runtime
      - task: discord:check:run

  discord:check:run:
    internal: true
    cmds:
      - '{{.PYTHON}} -m scripts.weekly_discord_summary check --output={{.OUTPUT | quote}}'

  discord:preview:
    desc: "Print the weekly expense summary without contacting Discord"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} -m scripts.weekly_discord_summary preview --output={{.OUTPUT | quote}} {{if .PERIOD_END}}--period-end={{.PERIOD_END | quote}}{{end}}'

  discord:test:
    desc: "Send a Discord connection test without financial data"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} -m scripts.weekly_discord_summary test --output={{.OUTPUT | quote}}'

  discord:send:
    desc: "Send the weekly expense summary now"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} -m scripts.weekly_discord_summary send --output={{.OUTPUT | quote}} {{if .PERIOD_END}}--period-end={{.PERIOD_END | quote}}{{end}} {{if eq .FORCE "true"}}--force{{end}}'
