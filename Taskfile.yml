---
version: '3'

vars:
  VENV: .venv
  PYTHON: '{{if eq OS "windows"}}{{.VENV}}/Scripts/python.exe{{else}}{{.VENV}}/bin/python{{end}}'
  UV: '{{if eq OS "windows"}}.tools/bin/uv.exe{{else}}.tools/bin/uv{{end}}'
  TASK: '{{if eq OS "windows"}}.tools/bin/task.exe{{else}}.tools/bin/task{{end}}'
  LINT_PATHS: src/ pages/ tests/ scripts/ Home.py
  ADDRESS: '{{default "127.0.0.1" .ADDRESS}}'
  PORT: '{{default "8501" .PORT}}'
  PERIOD_END: '{{default "" .PERIOD_END}}'
  FORCE: '{{default "false" .FORCE}}'
  OUTPUT: '{{default "text" .OUTPUT}}'

tasks:
  # ========================================
  # Setup
  # ========================================

  setup:
    desc: "Set up the development environment"
    cmds:
      - task: deps:install

  deps:
    desc: "Report project dependency status"
    cmds:
      - task: deps:check

  deps:install:
    desc: "Install pinned tools, Python, and development dependencies"
    cmds:
      - task: deps:task:install
      - task: deps:python:install
      - task: deps:sync
      - task: setup:verify
      - echo "[OK] Setup complete. Run 'task test' to run tests."

  deps:install:runtime:
    desc: "Install pinned Python and runtime dependencies"
    cmds:
      - task: deps:python:install
      - task: deps:sync:runtime
      - task: setup:verify:runtime

  deps:task:install:
    desc: "Install the pinned Task runner locally"
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 -SkipSetup
        platforms: [windows]
      - cmd: sh scripts/bootstrap.sh --skip-setup
        platforms: [linux, darwin]

  deps:python:install:
    desc: "Install pinned uv and Python locally"
    cmds:
      - cmd: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-python-toolchain.ps1
        platforms: [windows]
      - cmd: sh scripts/install-python-toolchain.sh
        platforms: [linux, darwin]

  deps:sync:
    desc: "Install locked development dependencies"
    cmds:
      - echo "[SETUP] Installing dependencies..."
      - '{{.UV}} sync --locked --dev'

  deps:sync:runtime:
    desc: "Install locked runtime dependencies"
    cmds:
      - echo "[SETUP] Installing runtime dependencies..."
      - '{{.UV}} sync --locked --no-dev'

  setup:check:
    desc: "Check development environment status"
    cmds:
      - echo "=== Development Environment Check ==="
      - '{{.TASK}} --version'
      - '{{.UV}} --version'
      - '{{.UV}} run --locked --dev python --version'
      - echo "=== Check complete ==="

  setup:verify:
    desc: "Verify setup is working"
    cmds:
      - echo "=== Verifying setup ==="
      - task: setup:check
      - '{{.UV}} run --locked --dev python -c "import streamlit; import pandas; import altair; print(\"[OK] All imports successful\")"'
      - '{{.UV}} run --locked --dev pytest --version'
      - echo "[OK] All verification checks passed."

  setup:verify:runtime:
    desc: "Verify runtime dependencies"
    cmds:
      - '{{.PYTHON}} -c "import streamlit; import pandas; import altair; import streamlit_gsheets; print(\"[OK] Runtime imports successful\")"'

  # ========================================
  # Package Management
  # ========================================

  deps:check:
    desc: "Check dependency metadata and package updates"
    aliases: [pkg:check]
    cmds:
      - '{{.UV}} lock --check'
      - '{{.UV}} pip list --outdated --python {{.PYTHON}}'

  deps:update:
    desc: "Update direct dependencies to latest exact pins"
    aliases: [pkg:update]
    cmds:
      - '{{.UV}} remove --no-sync altair pandas st-gsheets-connection streamlit'
      - '{{.UV}} add --no-sync --bounds exact altair pandas st-gsheets-connection streamlit'
      - '{{.UV}} remove --dev --no-sync freezegun mypy pandas-stubs pytest pytest-cov ruff'
      - '{{.UV}} add --dev --no-sync --bounds exact freezegun mypy pandas-stubs pytest pytest-cov ruff'
      - '{{.UV}} lock --upgrade'
      - '{{.UV}} sync --dev'
      - echo "Packages updated. Run 'task check' to verify nothing broke."

  # ========================================
  # Fixtures
  # ========================================

  fixtures:generate:
    desc: "Generate local anonymized fixtures (never committed)"
    cmds:
      - '{{.UV}} run --locked --dev python scripts/generate_test_fixtures.py'

  # ========================================
  # Testing
  # ========================================

  test:
    desc: "Run all tests"
    cmds:
      - '{{.UV}} run --locked --dev pytest'

  test:unit:
    desc: "Run unit tests"
    cmds:
      - '{{.UV}} run --locked --dev pytest tests/unit'

  test:integration:
    desc: "Run integration tests"
    cmds:
      - '{{.UV}} run --locked --dev pytest tests/integration'

  test:verbose:
    desc: "Run all tests with verbose output"
    cmds:
      - '{{.UV}} run --locked --dev pytest -v'

  test:file:
    desc: "Run tests for a specific file (usage: task test:file -- test_spreadsheet.py)"
    cmds:
      - '{{.UV}} run --locked --dev pytest tests/{{.CLI_ARGS}} -v'

  test:match:
    desc: "Run tests matching a pattern (usage: task test:match -- test_filter)"
    cmds:
      - '{{.UV}} run --locked --dev pytest -k "{{.CLI_ARGS}}" -v'

  test:coverage:
    desc: "Run tests with coverage report"
    cmds:
      - '{{.UV}} run --locked --dev pytest --cov=src --cov=pages --cov-branch --cov-report=term-missing --cov-fail-under=80'

  test:coverage:src:
    desc: "Run tests with src/ coverage gate (>=90%)"
    cmds:
      - '{{.UV}} run --locked --dev pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90'

  # ========================================
  # Linting
  # ========================================

  lint:
    desc: "Run ruff and mypy"
    cmds:
      - task: lint:shell
      - '{{.UV}} run --locked --dev ruff check {{.LINT_PATHS}}'
      - '{{.UV}} run --locked --dev mypy'

  lint:shell:
    internal: true
    platforms: [linux, darwin]
    cmds:
      - sh -n scripts/bootstrap.sh scripts/install-python-toolchain.sh

  format:
    desc: "Apply safe lint fixes, then run mypy"
    aliases: [lint:fix]
    cmds:
      - '{{.UV}} run --locked --dev ruff check --fix {{.LINT_PATHS}}'
      - '{{.UV}} run --locked --dev mypy'

  # ========================================
  # All Checks
  # ========================================

  check:
    desc: "Run lint and tests"
    cmds:
      - task: privacy:check
      - task: lint
      - task: test

  privacy:check:
    desc: "Check repository files for private data"
    cmds:
      - '{{.UV}} run --locked --dev python scripts/check_repository_privacy.py'

  config:init:
    desc: "Create an ignored local configuration file"
    cmds:
      - '{{.UV}} run --locked --dev python scripts/init_config.py'

  # ========================================
  # Run
  # ========================================

  run:
    desc: "Run the Streamlit app on a validated address (localhost by default)"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address={{.ADDRESS | quote}} --port={{.PORT | quote}}'

  demo:
    desc: "Run the app with synthetic demo data on localhost"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address=127.0.0.1 --port={{.PORT | quote}} --data-source=demo'

  run:lan:
    desc: "Run the app on all interfaces for a trusted network"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.run_app --address=0.0.0.0 --port={{.PORT | quote}}'

  doctor:
    desc: "Validate the configured data source"
    cmds:
      - '{{.UV}} run --locked --dev python -m scripts.doctor {{.CLI_ARGS}}'

  pages:build:
    desc: "Build the GitHub Pages demo artifact"
    cmds:
      - '{{.UV}} run --locked --dev python scripts/build_pages_demo.py'

  container:build:
    desc: "Build the local Linux container image"
    cmds:
      - docker build --tag portico:local .

  container:demo:
    desc: "Build and run the demo container on localhost"
    cmds:
      - docker compose --profile demo up --build demo

  container:live:
    desc: "Build and run the live container on localhost"
    cmds:
      - docker compose --profile live up --build live

  container:down:
    desc: "Stop app containers"
    cmds:
      - docker compose --profile demo --profile live down

  container:notifier:
    desc: "Run one notifier command in a temporary container"
    cmds:
      - docker compose build notifier
      - docker compose --profile notifier run --rm notifier {{.CLI_ARGS}}

  # ========================================
  # Weekly Discord Summary
  # ========================================

  discord:check:
    desc: "Install runtime dependencies and check Discord summary configuration"
    cmds:
      - task: deps:install:runtime
      - task: discord:check:run

  discord:check:run:
    internal: true
    cmds:
      - '{{.PYTHON}} scripts/weekly-discord-summary.py check --output={{.OUTPUT | quote}}'

  discord:preview:
    desc: "Print the weekly expense summary without contacting Discord"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} scripts/weekly-discord-summary.py preview --output={{.OUTPUT | quote}} {{if .PERIOD_END}}--period-end={{.PERIOD_END | quote}}{{end}}'

  discord:test:
    desc: "Send a Discord connection test without financial data"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} scripts/weekly-discord-summary.py test --output={{.OUTPUT | quote}}'

  discord:send:
    desc: "Send the weekly expense summary now"
    preconditions:
      - sh: '{{.PYTHON}} --version'
        msg: "Runtime dependencies are missing. Run 'task discord:check'."
    cmds:
      - '{{.PYTHON}} scripts/weekly-discord-summary.py send --output={{.OUTPUT | quote}} {{if .PERIOD_END}}--period-end={{.PERIOD_END | quote}}{{end}} {{if eq .FORCE "true"}}--force{{end}}'
