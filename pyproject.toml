[project]
name = "portico"
version = "1.2.0"
description = "A private, self-hosted Streamlit dashboard for spreadsheet-based personal finance analysis."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Nick Curry" },
]
maintainers = [
    { name = "Nick Curry" },
]
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "altair==6.2.2",
    "croniter==6.2.4",
    "pandas==3.0.5",
    "st-gsheets-connection==0.1.0",
    "streamlit==1.62.0",
]

[project.urls]
Homepage = "https://github.com/nccurry/portico"
Repository = "https://github.com/nccurry/portico"
Issues = "https://github.com/nccurry/portico/issues"
Changelog = "https://github.com/nccurry/portico/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "freezegun==1.5.5",
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260730",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "types-croniter==6.2.4.20260711",
]

[tool.portico.bootstrap]
python = "3.14.7"
uv = "0.12.8"
task = "3.53.1"

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle/pyflakes
    "UP",              # pyupgrade
    "RUF",             # ruff-specific
    "ANN",             # flake8-annotations: requires return types and arg annotations
    "PYI",             # stubs / typing best practices
    "B",               # flake8-bugbear
    "I",               # import ordering
    "C4",              # comprehensions
    "SIM",             # simpler control flow
]
ignore = [
    "E501",            # line length handled by line-length
]

[tool.mypy]
python_version = "3.14"
files = ["src", "app_pages", "demo", "tests", "scripts", "Home.py"]
strict = true
explicit_package_bases = true
enable_error_code = ["explicit-override", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "streamlit_gsheets.*", "freezegun.*"]
ignore_missing_imports = true
