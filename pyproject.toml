[project]
name = "tiller-streamlit"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle/pyflakes
    "UP",              # pyupgrade — bans Optional[X], Union[X,Y], List[X], Dict[K,V], etc.
    "RUF",             # ruff-specific
    "ANN",             # flake8-annotations: requires return types and arg annotations
    "PYI",             # stubs / typing best practices
    "B006",            # mutable default arguments
]
ignore = [
    "ANN401",          # allow Any (we genuinely need it for st.column_config)
    "E501",            # line length handled by `line-length`
]

[tool.mypy]
python_version = "3.14"
files = ["src", "Pages", "tests", "Home.py"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "streamlit_gsheets.*", "freezegun.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scripts/ are one-off developer tools (fixture generator, inspectors). They
# are not part of the runtime application and are intentionally excluded from
# strict type checking; tests/unit/src/test_generator.py exercises them.
module = ["scripts.*"]
ignore_errors = true

