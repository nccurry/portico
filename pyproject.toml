[project]
name = "tiller-streamlit"
version = "0.1.0"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "altair==6.2.2",
    "pandas==3.0.5",
    "st-gsheets-connection==0.1.0",
    "streamlit==1.60.0",
]

[dependency-groups]
dev = [
    "freezegun==1.5.5",
    "mypy==2.3.0",
    "pandas-stubs==3.0.5.260730",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[tool.tiller.bootstrap]
python = "3.14.6"
uv = "0.12.1"
task = "3.52.0"

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle/pyflakes
    "UP",              # pyupgrade
    "RUF",             # ruff-specific
    "ANN",             # flake8-annotations: requires return types and arg annotations
    "PYI",             # stubs / typing best practices
    "B006",            # mutable default arguments
]
ignore = [
    "E501",            # line length handled by line-length
]

[tool.mypy]
python_version = "3.14"
files = ["src", "Pages", "tests", "scripts", "Home.py"]
strict = true
explicit_package_bases = true
enable_error_code = ["explicit-override", "ignore-without-code"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "streamlit_gsheets.*", "freezegun.*"]
ignore_missing_imports = true
