[project]
name = "tiller-streamlit"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle/pyflakes
    "UP",              # pyupgrade — bans Optional[X], Union[X,Y], List[X], Dict[K,V], etc.
    "RUF",             # ruff-specific
    "ANN",             # flake8-annotations: requires return types and arg annotations
    "PYI",             # stubs / typing best practices
    "B006",            # mutable default arguments
]
ignore = [
    "ANN001",          # don't require annotations for `self` in methods
    "ANN401",          # allow Any (we genuinely need it for st.column_config)
    "E501",            # line length handled by `line-length`
]

[tool.ruff.lint.per-file-ignores]
# conftest.py and _helpers.py are NOT exempted: their helpers/fixtures must be typed.
# Only test functions themselves (def test_*) are exempted from arg-annotation
# and public-return-annotation rules. ANN202 is intentionally enforced so that
# any private helper or class-scoped @pytest.fixture method left in a test file
# is forced to declare a return type.
"tests/test_*.py" = [
    "ANN001",  # fixture-injected args don't need annotations on the test method
    "ANN201",  # def test_* doesn't need a return annotation
]

[tool.mypy]
python_version = "3.14"
files = ["src", "Pages", "tests"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["streamlit.*", "streamlit_gsheets.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "Pages.*",
    "src.page_helpers",
    "1_Income_and_Savings",
    "2_Spending_by_Category",
    "3_Year_over_Year",
    "4_Duplicate_Detection",
    "5_Subscriptions",
    "6_Merchant_Analysis",
    "7_Budget",
    "8_Top_Transactions",
]
disable_error_code = ["arg-type", "no-any-return", "misc"]
