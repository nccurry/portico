name: Bug report
description: Report a reproducible problem with the dashboard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include financial data, Google Sheet URLs, webhook URLs, or credentials. Use demo data or synthetic examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Select ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Give the release tag or commit hash.
    validations:
      required: true
  - type: dropdown
    id: data_mode
    attributes:
      label: Data mode
      options:
        - Demo data
        - Google Sheets
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostic output
      description: Paste `task doctor` output only after you examine it for private data.
      render: text
