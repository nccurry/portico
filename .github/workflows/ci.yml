name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache tools, Python, and venv
        uses: actions/cache@v4
        with:
          path: |
            .tools
            .venv
            ~/.cache/uv
          key: bootstrap-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'scripts/bootstrap.sh') }}

      - name: Bootstrap environment
        run: sh scripts/bootstrap.sh

      - name: Lint (ruff + mypy)
        run: .tools/bin/task lint

      - name: Test with coverage (src/ >= 90%)
        run: .tools/bin/task test:coverage:src

      - name: Test with coverage (combined >= 80%)
        run: .tools/bin/task test:coverage
