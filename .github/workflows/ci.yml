name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v6

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py314-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Create venv and install deps
        run: |
          uv venv .venv --python 3.14
          uv pip install -r requirements.txt --python .venv/bin/python
          uv pip install -r requirements-dev.txt --python .venv/bin/python

      - name: Lint (ruff + mypy)
        run: task lint

      - name: Test with coverage (src/ >= 90%)
        run: task test:coverage:src

      - name: Test with coverage (combined >= 80%)
        run: task test:coverage
