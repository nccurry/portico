name: portico

x-app: &app
  image: ${PORTICO_IMAGE:-ghcr.io/nccurry/portico:latest}
  build:
    context: .
    args:
      VERSION: ${VERSION:-dev}
      REVISION: ${REVISION:-unknown}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  demo:
    <<: *app
    profiles: [demo]
    environment:
      PORTICO_DATA_SOURCE: demo
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${HOST_ADDRESS:-127.0.0.1}:${PORT:-8501}:8501"
    restart: unless-stopped

  live:
    <<: *app
    profiles: [live]
    environment:
      PORTICO_DATA_SOURCE: google_sheets
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${HOST_ADDRESS:-127.0.0.1}:${PORT:-8501}:8501"
    volumes:
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  notifier:
    <<: *app
    profiles: [notifier]
    entrypoint: [python, scripts/weekly-discord-summary.py]
    command: [check]
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - type: bind
        source: ./.streamlit/secrets.toml
        target: /app/.streamlit/secrets.toml
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: notifier-state
        target: /app/.local

volumes:
  notifier-state:
