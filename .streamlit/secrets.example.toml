# Copy this file to .streamlit/secrets.toml. Never commit the copied file.
# Replace each URL with the link for the matching Google Sheets tab.
# The app is read-only and uses link-readable sheets without a service account.

[connections.transactions]
type = "gsheets"
spreadsheet = "https://docs.google.com/spreadsheets/d/<spreadsheet-id>/edit?gid=<transactions-gid>"

[connections.balance_history]
type = "gsheets"
spreadsheet = "https://docs.google.com/spreadsheets/d/<spreadsheet-id>/edit?gid=<balance-history-gid>"

[connections.categories]
type = "gsheets"
spreadsheet = "https://docs.google.com/spreadsheets/d/<spreadsheet-id>/edit?gid=<categories-gid>"

[connections.accounts]
type = "gsheets"
spreadsheet = "https://docs.google.com/spreadsheets/d/<spreadsheet-id>/edit?gid=<accounts-gid>"

# Optional weekly Discord summary.
# Create the webhook in the destination channel. Treat this URL as a password.
[notifications.discord]
webhook_url = "https://discord.com/api/webhooks/<webhook-id>/<webhook-token>"
