# Portico Roci desktop dashboard layout.
# This file controls presentation only. Keep calculation settings in portico-demo.toml
# or your existing Portico TOML file.

schema_version = 1
app_title = "Portico"

[[pages]]
id = "home"
title = "Home"
description = "Balance history, account groups, and financial safety at a glance."
visible = true
group = "standalone"
order = 1
rail_label = "Home"
page_heading = "Accounts and net worth"
icon = "home"

[[pages.sections]]
id = "net_worth"
title = "Net worth history"
description = "Track account balances and the change over the selected time frame."
layout = "flow"
order = 1

[[pages.sections]]
id = "what_changed"
title = "What changed"
description = "See each account group's contribution to net-worth movement."
layout = "flow"
order = 2

[[pages.sections]]
id = "account_groups"
title = "Account groups"
description = "Review balances, changes, and account details by group."
layout = "flow"
order = 3

[[pages.sections]]
id = "financial_safety"
title = "Financial safety"
description = "Check emergency coverage, debt progress, and FI funding."
layout = "flow"
order = 4

[[pages.controls]]
id = "time_frame"
label = "Time frame"
kind = "segmented_choice"
source = "home_time_frame"
option_source = "static"
default = "1y"
options = ["3m", "6m", "1y", "2y", "5y", "all"]
width = "full"

[[pages.widgets]]
id = "net-worth"
title = "Net worth history"
kind = "area_chart"
report = "home.net_worth"
span = 2
section = "net_worth"

[[pages.widgets]]
id = "what-changed"
title = "What changed"
kind = "bar_chart"
report = "home.attribution"
span = 2
section = "what_changed"

[[pages.widgets]]
id = "accounts"
title = "Account groups"
kind = "metric"
report = "home.accounts"
span = 2
section = "account_groups"

[[pages.widgets]]
id = "safety"
title = "Financial safety"
kind = "metric"
report = "home.safety"
span = 2
section = "financial_safety"

[[pages]]
id = "income_savings"
title = "Income and Savings"
description = "Monthly income, spending, surplus, and savings rate."
visible = true
group = "analyze"
order = 2
rail_label = "Income and savings"
page_heading = "Income and savings"
icon = "savings"

[[pages.controls]]
id = "income_view"
label = "View"
kind = "select"
source = "income_view"
default = "regular"
options = ["regular", "actual"]

[[pages.controls]]
id = "exclude_income_categories"
label = "Exclude income categories"
kind = "multi_select"
source = "income_excluded_categories"
option_source = "static"
defaults = []
options = ["Annual bonus", "Salary", "Tax refund", "Investment transfer", "RSU", "Interest", "Dividend"]
width = "full"

[[pages.controls]]
id = "detail_tab"
label = "Month detail"
kind = "tab_choice"
source = "income_detail_tab"
option_source = "static"
default = "Included"
options = ["Included", "Excluded"]
width = "full"

[[pages.widgets]]
id = "cash-flow"
title = "Monthly cash flow"
kind = "combo_chart"
report = "income.cash_flow"
span = 2
bar_series = ["income", "spending"]

[[pages.widgets]]
id = "savings-rate"
title = "Savings rate"
kind = "line_chart"
report = "income.savings_rate"
span = 2

[[pages]]
id = "spending"
title = "Spending by Category"
description = "Where expense money went over the selected period."
visible = true
group = "analyze"
order = 4
rail_label = "Spending by category"
page_heading = "Spending by category"
icon = "category"

[[pages.filters]]
id = "lookback"
label = "Lookback"
kind = "select"
source = "lookback"
default = "12"
options = ["3", "6", "12", "24"]

[[pages.filters]]
id = "transaction_set"
label = "Spending view"
kind = "select"
source = "spending"
default = "discretionary"
options = ["all", "discretionary"]

[[pages.widgets]]
id = "monthly"
title = "Monthly spending"
kind = "line_chart"
report = "spending.monthly"
span = 2

[[pages.widgets]]
id = "categories"
title = "Top categories"
kind = "bar_chart"
report = "spending.categories"
span = 2

[[pages]]
id = "year_over_year"
title = "Year over Year"
description = "Compare a spending view across calendar years."
visible = true
group = "analyze"
order = 5
rail_label = "Year over year"
page_heading = "Year over year"
icon = "compare_arrows"

[[pages.filters]]
id = "transaction_set"
label = "Spending view"
kind = "select"
source = "year_over_year"
default = "utilities"
options = ["all", "utilities", "discretionary"]

[[pages.widgets]]
id = "comparison"
title = "Monthly comparison"
kind = "line_chart"
report = "yoy.comparison"
span = 2

[[pages.widgets]]
id = "year-totals"
title = "Year totals"
kind = "bar_chart"
report = "yoy.totals"
span = 2

[[pages]]
id = "subscriptions"
title = "Subscriptions"
description = "Known recurring expenses and active subscription history."
visible = true
group = "analyze"
order = 6
rail_label = "Subscriptions"
page_heading = "Subscriptions"
icon = "subscriptions"

[[pages.widgets]]
id = "active"
title = "Active subscriptions"
kind = "timeline"
report = "subscriptions.active"
span = 2

[[pages.widgets]]
id = "monthly"
title = "Monthly subscription spending"
kind = "line_chart"
report = "subscriptions.monthly"
span = 2

[[pages]]
id = "merchants"
title = "Merchant Analysis"
description = "Merchants ranked by spend, with monthly history."
visible = true
group = "analyze"
order = 3
rail_label = "Spending by merchant"
page_heading = "Spending by merchant"
icon = "storefront"

[[pages.filters]]
id = "lookback"
label = "Lookback"
kind = "select"
source = "lookback"
default = "12"
options = ["3", "6", "12", "24"]

[[pages.filters]]
id = "transaction_set"
label = "Spending view"
kind = "select"
source = "spending"
default = "discretionary"
options = ["all", "discretionary"]

[[pages.widgets]]
id = "ranking"
title = "Top merchants"
kind = "bar_chart"
report = "merchants.ranking"
span = 2

[[pages.widgets]]
id = "history"
title = "Merchant history"
kind = "line_chart"
report = "merchants.history"
span = 2

[[pages]]
id = "budget"
title = "Budget"
description = "Budget allocations and actual category spending."
visible = true
group = "plan"
order = 8
rail_label = "Budget"
page_heading = "Budget"
icon = "account_balance_wallet"

[[pages.filters]]
id = "lookback"
label = "Lookback"
kind = "select"
source = "lookback"
default = "12"
options = ["3", "6", "12", "24"]

[[pages.widgets]]
id = "budget-vs-actual"
title = "Budget versus actual"
kind = "bar_chart"
report = "budget.comparison"
span = 2

[[pages.widgets]]
id = "budget-history"
title = "Budget history"
kind = "combo_chart"
report = "budget.history"
span = 2
bar_series = ["budget"]

[[pages.widgets]]
id = "budget-table"
title = "Budget details"
kind = "table"
report = "budget.table"
span = 2

[[pages]]
id = "top_transactions"
title = "Top Transactions"
description = "Large income and expense transactions in the selected period."
visible = true
group = "analyze"
order = 7
rail_label = "Transactions"
page_heading = "Transactions"
icon = "receipt_long"

[[pages.filters]]
id = "lookback"
label = "Lookback"
kind = "select"
source = "lookback"
default = "12"
options = ["3", "6", "12", "24"]

[[pages.widgets]]
id = "expense-scatter"
title = "Large expenses"
kind = "scatter_chart"
report = "top.expenses"
span = 2

[[pages.widgets]]
id = "income-scatter"
title = "Large income"
kind = "scatter_chart"
report = "top.incomes"
span = 2

[[pages.widgets]]
id = "transactions"
title = "Largest transactions"
kind = "table"
report = "top.table"
span = 2

[[pages]]
id = "financial_independence"
title = "Financial Independence"
description = "Portfolio funding, projection, and runway sensitivity."
visible = true
group = "plan"
order = 9
rail_label = "Financial independence"
page_heading = "Financial independence"
icon = "monitoring"

[[pages.widgets]]
id = "summary"
title = "Financial independence"
kind = "metric"
report = "fi.summary"

[[pages.widgets]]
id = "projection"
title = "Portfolio projection"
kind = "line_chart"
report = "fi.projection"

[[pages.widgets]]
id = "sensitivity"
title = "Runway sensitivity"
kind = "heatmap"
report = "fi.sensitivity"
span = 2

[[pages]]
id = "data_health"
title = "Data Health"
description = "Missing classifications, stale accounts, and duplicate-looking rows."
visible = true
group = "maintain"
order = 10
rail_label = "Data health"
page_heading = "Data health"
icon = "health_and_safety"

[[pages.widgets]]
id = "summary"
title = "Data health"
kind = "metric"
report = "health.summary"

[[pages.widgets]]
id = "findings"
title = "Findings"
kind = "table"
report = "health.findings"
span = 2
