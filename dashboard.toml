# Portico Roci desktop dashboard layout.
# This file controls presentation only. Keep calculation settings in portico-demo.toml
# or your existing Portico TOML file.

schema_version = 1
app_title = "Portico"

[[pages]]
id = "home"
title = "Home"
description = "Balance history, account groups, and financial safety at a glance."
visible = true
group = "standalone"
order = 1
rail_label = "Home"
page_heading = "Accounts and net worth"
icon = "home"

[[pages.sections]]
id = "net_worth"
title = "Net worth history"
description = "Track account balances and the change over the selected time frame."
layout = "flow"
order = 1

[[pages.sections]]
id = "what_changed"
title = "What changed"
description = "See each account group's contribution to net-worth movement."
layout = "flow"
order = 2

[[pages.sections]]
id = "account_groups"
title = "Account groups"
description = "Review balances, changes, and account details by group."
layout = "flow"
order = 3

[[pages.sections]]
id = "financial_safety"
title = "Financial safety"
description = "Check emergency coverage, debt progress, and FI funding."
layout = "flow"
order = 4

[[pages.controls]]
id = "time_frame"
label = "Time frame"
kind = "segmented_choice"
source = "home_time_frame"
option_source = "static"
default = "1y"
options = ["3m", "6m", "1y", "2y", "5y", "all"]
width = "full"

[[pages.widgets]]
id = "net-worth"
title = "Net worth history"
kind = "area_chart"
report = "home.net_worth"
span = 2
section = "net_worth"

[[pages.widgets]]
id = "what-changed"
title = "What changed"
kind = "bar_chart"
report = "home.attribution"
span = 2
section = "what_changed"

[[pages.widgets]]
id = "accounts"
title = "Account groups"
kind = "metric"
report = "home.accounts"
span = 2
section = "account_groups"

[[pages.widgets]]
id = "safety"
title = "Financial safety"
kind = "metric"
report = "home.safety"
span = 2
section = "financial_safety"

[[pages]]
id = "income_savings"
title = "Income and Savings"
description = "Monthly income, spending, surplus, and savings rate."
visible = true
group = "analyze"
order = 2
rail_label = "Income and savings"
page_heading = "Income and savings"
icon = "savings"

[[pages.sections]]
id = "monthly_cash_flow"
title = "Monthly cash flow"
description = "Compare income, spending, and surplus across the selected months."
layout = "flow"
order = 1

[[pages.sections]]
id = "month_detail"
title = "Month detail"
description = "Inspect the included and excluded transactions for one month."
layout = "flow"
order = 2

[[pages.sections]]
id = "monthly_totals"
title = "Monthly totals"
description = "Review the complete month-by-month calculation."
layout = "flow"
order = 3

[[pages.controls]]
id = "lookback"
label = "Time frame"
kind = "segmented_choice"
source = "income_lookback"
default = "12"
options = ["3", "6", "12", "24"]

[[pages.controls]]
id = "calculation"
label = "Calculation"
kind = "segmented_choice"
source = "income_calculation"
default = "regular"
options = ["regular", "actual"]

[[pages.controls]]
id = "adjust_calculation"
label = "Adjust calculation"
kind = "popover"
source = "income_adjust_calculation"

[[pages.controls]]
id = "reset_adjustments"
label = "Reset defaults"
kind = "action_reset"
source = "income_reset"

[[pages.controls]]
id = "exclude_income_categories"
label = "Exclude income categories"
kind = "multi_select"
source = "income_excluded_income_categories"
option_source = "income_income_categories"
defaults = []
width = "full"

[[pages.controls]]
id = "exclude_expense_groups"
label = "Exclude expense groups"
kind = "multi_select"
source = "income_excluded_expense_groups"
option_source = "income_expense_groups"
defaults = []
width = "full"

[[pages.controls]]
id = "exclude_expense_categories"
label = "Exclude expense categories"
kind = "multi_select"
source = "income_excluded_expense_categories"
option_source = "income_expense_categories"
defaults = []
width = "full"

[[pages.controls]]
id = "include_transaction_names"
label = "Include transaction names containing"
kind = "text_multi_select"
source = "income_included_descriptions"
width = "full"

[[pages.controls]]
id = "exclude_transaction_names"
label = "Exclude transaction names containing"
kind = "text_multi_select"
source = "income_excluded_descriptions"
width = "full"

[[pages.controls]]
id = "exclude_large_income"
label = "Exclude individual income over a limit"
kind = "toggle"
source = "income_exclude_large_income"
default = "false"

[[pages.controls]]
id = "income_limit"
label = "Income limit"
kind = "number_input"
source = "income_income_limit"
default = "20000"
minimum = 5000
maximum = 100000
step = 1000

[[pages.controls]]
id = "exclude_large_expenses"
label = "Exclude individual expenses over a limit"
kind = "toggle"
source = "income_exclude_large_expenses"
default = "false"

[[pages.controls]]
id = "expense_limit"
label = "Expense limit"
kind = "number_input"
source = "income_expense_limit"
default = "3000"
minimum = 1000
maximum = 100000
step = 500

[[pages.controls]]
id = "savings_rate_target"
label = "Savings rate target"
kind = "number_input"
source = "income_target_rate"
default = "20"
minimum = 0
maximum = 100
step = 5

[[pages.controls]]
id = "detail_month"
label = "Month"
kind = "select"
source = "income_detail_month"
option_source = "income_months"

[[pages.controls]]
id = "detail_tab"
label = "Month detail"
kind = "tab_choice"
source = "income_detail_tab"
option_source = "static"
default = "Included"
options = ["Included", "Excluded"]
width = "full"

[[pages.widgets]]
id = "summary"
title = "Summary"
kind = "metric"
report = "income.summary"
span = 2
section = "monthly_cash_flow"

[[pages.widgets]]
id = "cash-flow"
title = "Monthly cash flow"
kind = "combo_chart"
report = "income.cash_flow"
span = 2
bar_series = ["income", "spending"]
section = "monthly_cash_flow"
y_axis_title = "Monthly cash flow ($)"

[[pages.widgets]]
id = "savings-rate"
title = "Savings rate"
kind = "line_chart"
report = "income.savings_rate"
span = 2
section = "monthly_cash_flow"
y_axis_title = "Savings rate (%)"

[[pages.widgets]]
id = "detail"
title = "Month detail"
kind = "metric"
report = "income.detail"
span = 2
section = "month_detail"

[[pages.widgets]]
id = "included-categories"
title = "By category"
kind = "table"
report = "income.included_categories"
span = 2
section = "month_detail"

[[pages.widgets]]
id = "included-transactions"
title = "Included transactions"
kind = "table"
report = "income.included_transactions"
span = 2
section = "month_detail"

[[pages.widgets]]
id = "excluded-transactions"
title = "Excluded transactions"
kind = "table"
report = "income.excluded_transactions"
span = 2
section = "month_detail"

[[pages.widgets]]
id = "monthly-totals"
title = "Monthly totals"
kind = "table"
report = "income.monthly_totals"
span = 2
section = "monthly_totals"

[[pages]]
